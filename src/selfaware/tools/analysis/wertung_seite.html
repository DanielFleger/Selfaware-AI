<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SamurAI · Wertung je Einheit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Farben und Masse aus der D-aiBubble (tools/d_aibubble/stil.css), dazu die Glut der UCP-Oberflaeche fuer Rang und Kopf.
   Feste Bedeutung (GG 165): Gruen = Lohn/gewonnen, Rot = Abzug/verloren - nichts anderes nimmt diese Farben. */
:root {
  --flaeche: #f5f6f8; --karte: #ffffff; --tinte: #1d1d1f; --tinte-sanft: #6b6b70; --linie: #e2e2e6;
  --akzent: #2b2b30; --akzent-tinte: #ffffff; --akzent-sanft: #ececed;
  --lohn: #2f9e44; --lohn-sanft: #e7f5ea; --abzug: #c0392b; --abzug-sanft: #fbeaea;
  --glut: #c9772b; --glut-sanft: #fbf1e6;
  --rund: 10px; --rund-pille: 20px; --t: 150ms;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--flaeche); color: var(--tinte); font-family: Barlow, Arial, sans-serif; font-size: 14px; }
button, input, select { font: inherit; }
.zahl { font-variant-numeric: tabular-nums; }
.hinweis { color: var(--tinte-sanft); font-size: 12.5px; }
.pos { color: var(--lohn); } .neg { color: var(--abzug); } .null { color: #c4c4c9; }

/* Kopf: wer gegen wen, wer fiel, gewonnen oder verloren - das Wichtigste zuerst (Daniel 18:16) */
.kopf { position: relative; color: #fff; padding: 18px 32px 16px; overflow: hidden; background: #3a2418 url("/bild/hintergrund") center 28% / cover no-repeat; }
.kopf::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,12,8,.94) 0%, rgba(30,16,10,.82) 50%, rgba(40,18,8,.45) 100%); }
.kopf > * { position: relative; }
.kopf .oben { display: flex; align-items: center; gap: 14px; justify-content: space-between; }
.kopf .auge { font: 600 12px/1 "Barlow Condensed", Barlow, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #f3c58e; }
.kopf select { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: var(--rund-pille); padding: 5px 14px; max-width: 520px; cursor: pointer; }
.kopf select option { color: var(--tinte); }
.duell { display: flex; align-items: center; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
.spieler { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 8px 16px 8px 8px; min-width: 250px; }
.spieler.wir { border-color: rgba(243,197,142,.7); }
.spieler.tot { opacity: .62; }
.avatar { width: 54px; height: 54px; border-radius: 12px; background: #2a1d16 center / cover no-repeat; display: grid; place-items: center; font: 700 20px/1 "Barlow Condensed", Barlow, sans-serif; color: #f3c58e; border: 2px solid rgba(255,255,255,.25); flex: none; }
.spieler .name { font: 700 20px/1.1 "Barlow Condensed", Barlow, sans-serif; }
.spieler .zusatz { font-size: 12px; color: #f1dcc4; }
.spieler .lord { font-size: 12.5px; margin-top: 2px; }
.gegen { font: 700 22px/1 "Barlow Condensed", Barlow, sans-serif; color: #f3c58e; }
.ergebnis { font: 700 26px/1 "Barlow Condensed", Barlow, sans-serif; letter-spacing: .08em; padding: 10px 18px; border-radius: 12px; text-transform: uppercase; }
.ergebnis.gewonnen { background: var(--lohn); } .ergebnis.verloren { background: var(--abzug); } .ergebnis.offen { background: rgba(255,255,255,.18); }
.kacheln { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.kachel { background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.22); border-radius: var(--rund); padding: 5px 11px; }
.kachel b { display: block; font: 700 17px/1.1 "Barlow Condensed", Barlow, sans-serif; }
.kachel span { font-size: 11.5px; color: #f1dcc4; }

/* Reiter */
.reiter { display: flex; gap: 4px; padding: 0 32px; background: var(--karte); border-bottom: 1px solid var(--linie); position: sticky; top: 0; z-index: 5; }
.reiter button { border: 0; background: none; padding: 13px 14px 11px; color: var(--tinte-sanft); cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; }
.reiter button:hover { color: var(--tinte); }
.reiter button[aria-selected="true"] { color: var(--tinte); border-bottom-color: var(--glut); }
.reiter .rechts { margin-left: auto; align-self: center; font-size: 12px; color: var(--tinte-sanft); }
main { padding: 18px 32px 60px; }
.leiste { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.such { display: flex; align-items: center; gap: 6px; }
.such input { width: 240px; border: 1px solid var(--linie); background: var(--karte); border-radius: var(--rund-pille); padding: 6px 12px; }
.such .leeren { border: 0; background: none; color: var(--tinte-sanft); cursor: pointer; font-size: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--linie); background: var(--karte); border-radius: var(--rund-pille); padding: 5px 12px; cursor: pointer; }
.chip:hover { border-color: var(--akzent); }
.chip[aria-pressed="true"] { background: var(--akzent); color: var(--akzent-tinte); border-color: var(--akzent); }
.knopf { border: 1px solid var(--linie); background: var(--karte); border-radius: var(--rund-pille); padding: 5px 12px; cursor: pointer; }
.knopf:hover { border-color: var(--akzent); }
.knopf.voll { background: var(--akzent); color: var(--akzent-tinte); border-color: var(--akzent); }

/* Tabellen wie eine Monday-Liste: Kopf zum Sortieren, Summenzeile unten */
.tafel { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--rund); overflow: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--linie); text-align: right; white-space: nowrap; }
th.l, td.l { text-align: left; }
thead th { position: sticky; top: 0; background: #fafafb; font-weight: 600; font-size: 12.5px; color: var(--tinte-sanft); cursor: pointer; user-select: none; z-index: 1; }
thead th:hover { color: var(--tinte); background: var(--akzent-sanft); }
thead th .pf { display: inline-block; width: 10px; color: var(--glut); }
thead th.lohn { box-shadow: inset 0 -3px 0 var(--lohn); } thead th.abzug { box-shadow: inset 0 -3px 0 var(--abzug); }
tbody tr.zeile { cursor: pointer; transition: background var(--t); }
tbody tr.zeile:hover { background: #f8f8fa; box-shadow: inset 4px 0 0 var(--glut); }
tbody tr.zeile.offen { background: var(--glut-sanft); box-shadow: inset 4px 0 0 var(--glut); }
tfoot td { background: #fafafb; font-weight: 600; border-bottom: 0; border-top: 2px solid var(--linie); }
.rang { font: 700 15px/1 "Barlow Condensed", Barlow, sans-serif; color: var(--tinte-sanft); } .rang.top { color: var(--glut); }
.einheit { display: flex; align-items: center; gap: 10px; }
.bild { width: 34px; height: 34px; border-radius: 8px; background: #1b1b1f center / 140% no-repeat; flex: none; display: inline-grid; place-items: center; color: #fff; font: 700 12px/1 "Barlow Condensed", Barlow, sans-serif; vertical-align: middle; }
.einheit .n { font-weight: 600; } .einheit .s { font-size: 12px; color: var(--tinte-sanft); }
.tot { font-size: 11px; background: var(--akzent-sanft); color: var(--tinte-sanft); padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
/* Balken: eigene Spalte, alle beginnen an derselben Kante (Daniel 18:14 "die balken sind nicht linksbuendig") */
td.balken-z { text-align: left; width: 150px; }
.balken { width: 140px; height: 8px; border-radius: 4px; background: var(--akzent-sanft); overflow: hidden; }
.balken i { display: block; height: 100%; }
td.gesamt { font-weight: 700; font-size: 15px; min-width: 70px; }
tr.detail td { background: #fcfcfd; text-align: left; padding: 0; white-space: normal; }
.detail-innen { display: grid; grid-template-columns: minmax(420px, 1.1fr) 1fr; gap: 18px; padding: 16px 20px 18px; position: sticky; left: 0; width: min(1480px, calc(100vw - 90px)); }
.detail-innen h3 { margin: 0 0 8px; font: 700 15px/1.2 "Barlow Condensed", Barlow, sans-serif; letter-spacing: .02em; text-transform: uppercase; color: var(--tinte-sanft); }
.zu { position: absolute; top: 10px; right: 12px; }
.aufstellung { border: 1px solid var(--linie); border-radius: var(--rund); overflow: hidden; }
.aufstellung td, .aufstellung th { padding: 6px 10px; font-size: 13px; }
.aufstellung th { position: static; background: #f6f6f8; cursor: default; }
.aufstellung .wort { font-size: 11.5px; color: var(--tinte-sanft); white-space: normal; }
.aufstellung tr.summe td { font-weight: 700; background: #f6f6f8; }
.ereignisse { max-height: 320px; overflow: auto; border: 1px solid var(--linie); border-radius: var(--rund); background: var(--karte); }
.ereignis { display: flex; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--linie); font-size: 13px; align-items: baseline; }
.ereignis .t { color: var(--tinte-sanft); width: 64px; flex: none; text-align: right; }
.etikett { font-size: 11px; padding: 1px 8px; border-radius: 10px; flex: none; }
.etikett.pos { background: var(--lohn-sanft); } .etikett.neg { background: var(--abzug-sanft); }
.marke { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.marke.gewonnen { background: var(--lohn-sanft); color: var(--lohn); } .marke.verloren { background: var(--abzug-sanft); color: var(--abzug); } .marke.offen { background: var(--akzent-sanft); color: var(--tinte-sanft); }
.mini { display: inline-flex; align-items: center; gap: 4px; }
.mini .bild { width: 22px; height: 22px; border-radius: 6px; font-size: 10px; }
.stern { color: var(--glut); font-weight: 700; }
.historie td { background: #fbfaf7; font-size: 12px; color: var(--tinte-sanft); text-align: left; white-space: normal; }
.historie code { font-size: 11.5px; background: var(--akzent-sanft); padding: 1px 6px; border-radius: 6px; margin-right: 6px; }

/* Regler als Klappen (Daniel 18:15 "mach die bitte dropdowns" - Lesart, ungeprueft) */
.gruppe { margin-bottom: 14px; }
.gruppe h4 { margin: 0 0 6px; font: 700 13px/1 "Barlow Condensed", Barlow, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--tinte-sanft); }
details.regler { background: var(--karte); border: 1px solid var(--linie); border-left: 4px solid var(--linie); border-radius: var(--rund); margin-bottom: 6px; }
details.regler.pos { border-left-color: var(--lohn); } details.regler.neg { border-left-color: var(--abzug); }
details.regler summary { list-style: none; display: grid; grid-template-columns: 1fr 90px 150px 24px; gap: 10px; align-items: center; padding: 9px 14px; cursor: pointer; }
details.regler summary::-webkit-details-marker { display: none; }
details.regler summary:hover { background: #fafafb; }
details.regler summary .pfeil { color: var(--tinte-sanft); transition: transform var(--t); }
details.regler[open] summary .pfeil { transform: rotate(90deg); }
details.regler .innen { padding: 4px 14px 12px; border-top: 1px solid var(--linie); }
details.regler .reihe { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
details.regler input[type=range] { flex: 1; accent-color: var(--glut); min-width: 0; }
details.regler input[type=number] { width: 74px; border: 1px solid var(--linie); border-radius: 6px; padding: 4px 6px; text-align: right; }
details.regler select { border: 1px solid var(--linie); border-radius: 6px; padding: 3px 6px; background: var(--karte); }
.neu-regler { background: var(--karte); border: 1px dashed #c9c9cf; border-radius: var(--rund); padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.abschnitt { margin: 22px 0 10px; font: 700 13px/1 "Barlow Condensed", Barlow, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--tinte-sanft); display: flex; align-items: center; gap: 10px; }
.abschnitt::after { content: ""; flex: 1; height: 1px; background: var(--linie); }
.fehler { background: var(--abzug-sanft); color: var(--abzug); border: 1px solid #f0c4c0; border-radius: var(--rund); padding: 10px 14px; margin-bottom: 12px; display: none; }
.leer { padding: 40px; text-align: center; color: var(--tinte-sanft); }
.verlauf .eintrag { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--rund); padding: 10px 14px; margin-bottom: 8px; }
</style>
</head>
<body>
<header class="kopf">
  <div class="oben"><div class="auge">SamurAI · Wertungsmesser · Prototyp</div><select id="partie" title="Partie wählen (neueste zuerst)"></select></div>
  <div class="duell" id="duell"></div>
</header>
<nav class="reiter">
  <button data-ansicht="einheiten" aria-selected="true">Einheiten</button>
  <button data-ansicht="arten">Arten</button>
  <button data-ansicht="spiele">Spiele</button>
  <button data-ansicht="regler">Regler</button>
  <button data-ansicht="verlauf">Regler-Verlauf</button>
  <span class="rechts" id="stand"></span>
</nav>
<main>
  <div class="fehler" id="fehler"></div>
  <section id="v-einheiten"></section><section id="v-arten" hidden></section><section id="v-spiele" hidden></section>
  <section id="v-regler" hidden></section><section id="v-verlauf" hidden></section>
</main>
<script>
"use strict";
const S = { partien: [], partie: null, regler: [], mg: {}, verlauf: [], ansicht: "einheiten", sort: { k: "gesamt", ab: true },
  artSort: { k: "summe", ab: true }, spSort: { k: "zeit", ab: true }, suche: "", art: "alle", offen: new Set(), spiele: null,
  historie: [], wahl: new Set(), spFilter: { aufstellung: false, logbuch: false }, anzeige: "punkte" };
// Rohwert in echter Einheit (Daniel 18:37 "in absolut wie viel ... gebaeudeschaden ... wie viele gebaeude ... ticks")
const roh = (e, mg) => (e.roh || {})[mg] || 0;
const rohText = (x) => (Math.abs(x) < 0.005 ? '<span class="null">·</span>' : zahl(x, Math.abs(x) >= 100 ? 0 : 2));
const $ = (s, w) => (w || document).querySelector(s);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const zahl = (x, n) => (x == null ? "–" : Number(x).toLocaleString("de-DE", { maximumFractionDigits: n == null ? 1 : n }));
const pkt = (x) => (Math.abs(x) < 0.05 ? '<span class="null">·</span>' : `<span class="${x > 0 ? "pos" : "neg"}">${x > 0 ? "+" : ""}${zahl(x)}</span>`);
const kurzArt = (n) => String(n).split(" (")[0];
const codeArt = (n) => (String(n).split(" (")[1] ? "(" + String(n).split(" (")[1] : "");
const ERG = { gewonnen: "Gewonnen", verloren: "Verloren", offen: "Offen" };
function fehler(t) { const f = $("#fehler"); f.textContent = t || ""; f.style.display = t ? "block" : "none"; }
async function holen(url, opt) { const r = await fetch(url, opt); const d = await r.json(); if (!r.ok || d.fehler) throw new Error(d.fehler || r.statusText); return d; }
const bildEinheit = (typ, name) => `<span class="bild" style="background-image:url('/bild/einheit/${typ}')" title="${esc(name)}"></span>`;
function balken(wert, max) {
  const b = Math.min(100, (Math.abs(wert) / Math.max(1e-9, max)) * 100);
  return `<div class="balken"><i style="width:${b}%;background:${wert >= 0 ? "var(--lohn)" : "var(--abzug)"}"></i></div>`;
}

// ---- Rechnung: Punkte = Menge x Gewicht je aktivem Regler (dieselbe wie telemetry/wertung.punkte) ----
const aktiv = () => S.regler.filter((r) => !r.archiviert);
const gilt = (r, typ) => r.arten === "alle" || r.arten.includes(Number(typ));
function punkteVon(e) {
  const je = {}; let summe = 0;
  for (const r of aktiv()) { if (!gilt(r, e.typ)) continue; const m = e.menge[r.messgroesse] || 0; if (!m) continue; je[r.id] = m * r.gewicht; summe += je[r.id]; }
  return { je, summe };
}
function artPunkte(typ, a) { let s = 0; for (const r of aktiv()) if (gilt(r, typ)) s += (a.menge[r.messgroesse] || 0) * r.gewicht; return s; }

// ---- Adresse traegt die Ansicht (UX 20) ----
function adresse(ersetzen) {
  const h = "#" + new URLSearchParams({ partie: S.partie ? S.partie.partie + ".jsonl.gz" : "", ansicht: S.ansicht });
  if (location.hash !== h) (ersetzen ? history.replaceState : history.pushState).call(history, null, "", h);
}
const adresseLesen = () => { const p = new URLSearchParams(location.hash.slice(1)); return { partie: p.get("partie"), ansicht: p.get("ansicht") }; };
window.addEventListener("popstate", async () => { const a = adresseLesen(); if (a.ansicht) zeige(a.ansicht, true);
  if (a.partie && (!S.partie || S.partie.partie + ".jsonl.gz" !== a.partie)) await ladePartie(a.partie, true); });

async function start() {
  try {
    const [p, r] = await Promise.all([holen("/api/partien"), holen("/api/regler")]);
    S.partien = p; regAnnehmen(r);
    $("#partie").innerHTML = p.map((x) => `<option value="${esc(x.datei)}">${esc(x.zeit)} · ${x.kill_takt ? "Kill " + zahl(x.kill_takt, 0) : "kein Kill"} · ${esc(x.datei.replace("lage_", "").replace(".jsonl.gz", ""))}</option>`).join("");
    $("#partie").onchange = () => ladePartie($("#partie").value);
    const a = adresseLesen(); if (a.ansicht) zeige(a.ansicht, true);
    await ladePartie(a.partie && p.some((x) => x.datei === a.partie) ? a.partie : (p[0] || {}).datei, true);
  } catch (ex) { fehler("Laden fehlgeschlagen: " + ex.message); }
}
function regAnnehmen(r) { S.regler = r.regler; S.mg = r.messgroessen; S.verlauf = r.verlauf; }
async function ladePartie(datei, ersetzen) {
  if (!datei) return;
  $("#partie").value = datei; $("#stand").textContent = "rechne …";
  try { S.partie = await holen("/api/partie?datei=" + encodeURIComponent(datei)); S.offen.clear(); fehler(""); }
  catch (ex) { fehler("Partie nicht lesbar: " + ex.message); return; }
  adresse(ersetzen); alles();
}

// ---- Kopf ----
function kopf() {
  const P = S.partie; if (!P) return;
  const summe = P.einheiten.reduce((s, e) => s + punkteVon(e).summe, 0);
  const karten = (P.spieler_anzeige || []).map((sp) => {
    const av = sp.bild ? `<span class="avatar" style="background-image:url('${esc(sp.bild)}')"></span>` : `<span class="avatar">${esc(sp.name.slice(0, 2))}</span>`;
    return `<div class="spieler${sp.wir ? " wir" : ""}${sp.lord_tod ? " tot" : ""}">${av}<div><div class="name">${esc(sp.name)}${sp.wir ? " · wir" : ""}</div>
      <div class="zusatz">Spieler ${sp.nr}${sp.platz ? " · KI-Platz " + sp.platz : ""}${sp.belegt ? "" : " · Name nicht aufgezeichnet"}</div>
      <div class="lord">${sp.lord_tod ? "✝ Lord gefallen bei Takt " + zahl(sp.lord_tod, 0) : "♛ Lord lebt"}</div></div></div>`;
  });
  $("#duell").innerHTML = karten.join('<span class="gegen">gegen</span>') +
    `<span class="ergebnis ${P.ergebnis}">${ERG[P.ergebnis] || P.ergebnis}</span>
     <div class="kacheln"><div class="kachel"><b class="zahl">${P.kill_takt ? zahl(P.kill_takt, 0) : "–"}</b><span>Kill bei Takt</span></div>
     <div class="kachel"><b class="zahl">${zahl(P.einheiten.length, 0)}</b><span>Kämpfer gewertet</span></div>
     <div class="kachel"><b class="zahl">${summe > 0 ? "+" : ""}${zahl(summe)}</b><span>Punkte gesamt</span></div>
     <div class="kachel" title="Zerstörungen, für die das Protokoll keinen eigenen Täter zeigt"><b class="zahl">${zahl(P.ohne_taeter.gebaeude_zerstoert, 0)}</b><span>Gebäude ohne Täter</span></div></div>`;
  $("#stand").textContent = (P.logbuch ? "" : "ohne Logbuch: Denken und geplantes Warten nicht messbar · ") + (P.spieler_angenommen ? "Spieler angenommen · " : "") + "bis Takt " + zahl(P.letzter_takt, 0) + " · Rechnung v" + P.version;
}

// ---- Einheiten ----
const kurzName = (r) => S.mg[r.messgroesse].name + (r.arten === "alle" ? "" : " · nur " + r.arten.join(","));
function zeichneEinheiten() {
  const P = S.partie, v = $("#v-einheiten");
  const arten = [...new Map(P.einheiten.map((e) => [e.typ, e.name])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const sp = aktiv().filter((r) => P.einheiten.some((e) => (e.menge[r.messgroesse] || 0) && gilt(r, e.typ))).sort((a, b) => (b.gewicht > 0) - (a.gewicht > 0));
  let L = P.einheiten.map((e) => ({ e, p: punkteVon(e) })); const hier = L.length;
  if (S.art !== "alle") L = L.filter((x) => String(x.e.typ) === S.art);
  const such = S.suche.trim().toLowerCase(); if (such) L = L.filter((x) => (x.e.name + " " + x.e.nr).toLowerCase().includes(such));
  const werte = S.anzeige === "werte";
  const zelle = (x, r) => (werte ? roh(x.e, r.messgroesse) : x.p.je[r.id] || 0);

function detail(e, p) {

// ---- Arten ----
function zeichneArten() {
  const P = S.partie, v = $("#v-arten"), m = new Map();
  for (const e of P.einheiten) { const s = punkteVon(e).summe; const a = m.get(e.typ) || { typ: e.typ, name: e.name, n: 0, summe: 0, gefallen: 0, bester: null, schw: null };
    a.n++; a.summe += s; if (e.gestorben) a.gefallen++; if (!a.bester || s > a.bester.s) a.bester = { s, e }; if (!a.schw || s < a.schw.s) a.schw = { s, e }; m.set(e.typ, a); }
  const L = [...m.values()].map((a) => ({ ...a, mittel: a.summe / a.n })), k = S.artSort;
  L.sort((a, b) => { const A = a[k.k], B = b[k.k], c = typeof A === "string" ? A.localeCompare(B) : A - B; return k.ab ? -c : c; });
  const max = Math.max(1e-9, ...L.map((a) => Math.abs(a.mittel)));
  const pf = (s) => `<span class="pf">${k.k === s ? (k.ab ? "▼" : "▲") : ""}</span>`;
  v.innerHTML = `<div class="leiste"><span class="hinweis">Je Einheitenart dieser Partie. Klick auf eine Zeile zeigt ihre Einheiten.</span></div><div class="tafel"><table><thead><tr>
    <th class="l" data-s="name">Art ${pf("name")}</th><th data-s="n">Einheiten ${pf("n")}</th><th data-s="gefallen">gefallen ${pf("gefallen")}</th><th data-s="summe">Punkte zusammen ${pf("summe")}</th>
    <th data-s="mittel">je Einheit ${pf("mittel")}</th><th class="l"></th><th class="l">Beste</th><th class="l">Schwächste</th></tr></thead><tbody>
    ${L.map((a) => `<tr class="zeile" data-typ="${a.typ}" title="Klicken: Einheiten dieser Art zeigen"><td class="l"><div class="einheit">${bildEinheit(a.typ, a.name)}<div><div class="n">${esc(kurzArt(a.name))}</div><div class="s">${esc(codeArt(a.name))}</div></div></div></td>
      <td class="zahl">${a.n}</td><td class="zahl">${a.gefallen}</td><td class="zahl">${pkt(a.summe)}</td><td class="zahl gesamt">${pkt(a.mittel)}</td><td class="balken-z">${balken(a.mittel, max)}</td>
      <td class="l">${a.bester.e.nr} (${pkt(a.bester.s)})</td><td class="l">${a.schw.e.nr} (${pkt(a.schw.s)})</td></tr>`).join("")}</tbody></table></div>`;
  v.querySelectorAll("th[data-s]").forEach((th) => (th.onclick = () => { const s = th.dataset.s; S.artSort = { k: s, ab: k.k === s ? !k.ab : s !== "name" }; zeichneArten(); }));
  v.querySelectorAll("tr[data-typ]").forEach((tr) => (tr.onclick = () => { S.art = tr.dataset.typ; zeige("einheiten"); }));
}

// ---- Spiele: alle Partien, welche Art wann am besten war, Vergleich, und die Code-Aenderungen dazwischen ----
async function ladeSpiele() {
  try { const [sp, h] = await Promise.all([holen("/api/spiele"), S.historie.length ? Promise.resolve(S.historie) : holen("/api/historie")]); S.spiele = sp; S.historie = h; }
  catch (ex) { fehler("Spiele nicht lesbar: " + ex.message); return; }
  if (S.ansicht === "spiele") zeichneSpiele();
  if (S.spiele.stand.laeuft) setTimeout(ladeSpiele, 4000);
}
function spielZeile(x) {
  const arten = Object.entries(x.arten).map(([t, a]) => ({ typ: Number(t), name: a.name, n: a.n, summe: artPunkte(t, a), je: artPunkte(t, a) / a.n }));
  const summe = arten.reduce((s, a) => s + a.summe, 0);
  const beste = arten.filter((a) => a.n > 0).sort((a, b) => b.je - a.je)[0];
  return { x, arten, summe, beste };
}
const aufstellungText = (x) => (x.spieler_anzeige || []).map((s) => s.name).join(" gegen ");
function zeichneSpiele() {
  const v = $("#v-spiele");
  if (!S.spiele) { v.innerHTML = '<div class="leer">lade alle Spiele …</div>'; ladeSpiele(); return; }
  const st = S.spiele.stand;
  let L = S.spiele.spiele.map(spielZeile);
  const jetzt = S.partie ? aufstellungText(S.partie) : "";
  if (S.spFilter.aufstellung && jetzt) L = L.filter((z) => aufstellungText(z.x) === jetzt);
  if (S.spFilter.logbuch) L = L.filter((z) => z.x.logbuch);
  const typen = [...new Set(L.flatMap((z) => z.arten.map((a) => a.typ)))].sort((a, b) => a - b);
  const namen = new Map(L.flatMap((z) => z.arten.map((a) => [a.typ, a.name])));
  const k = S.spSort, w = (z) => k.k === "zeit" ? (z.x.datei.match(/\d{8}_\d{6}/) || [""])[0] : k.k === "summe" ? z.summe : k.k === "kill" ? (z.x.kill_takt || 1e9) : k.k.startsWith("t") ? ((z.arten.find((a) => a.typ === Number(k.k.slice(1))) || {}).je ?? -1e9) : 0;
  L.sort((a, b) => { const A = w(a), B = w(b), c = typeof A === "string" ? A.localeCompare(B) : A - B; return k.ab ? -c : c; });
  const max = Math.max(1e-9, ...L.map((z) => Math.abs(z.summe)));
  const pf = (s) => `<span class="pf">${k.k === s ? (k.ab ? "▼" : "▲") : ""}</span>`;
  const stempel = (z) => (z.x.datei.match(/\d{8}_\d{6}/) || [""])[0];
  const zeilen = L.map((z, i) => {
    const x = z.x, gew = S.wahl.has(x.datei);
    const gegner = (x.spieler_anzeige || []).map((s) => `<span class="mini" title="${esc(s.name)}${s.lord_tod ? " – Lord gefallen bei Takt " + s.lord_tod : ""}">${s.bild ? `<span class="bild" style="background-image:url('${esc(s.bild)}');background-size:cover"></span>` : `<span class="bild">${esc(s.name.slice(0, 2))}</span>`}${esc(s.name)}${s.lord_tod ? " ✝" : ""}</span>`).join(' <span class="hinweis">gegen</span> ');
    let hist = "";
    if (k.k === "zeit" && k.ab && i > 0) { // Code-Aenderungen zwischen diesem und dem naechstneueren Spiel (Historie, Daniel 18:18)
      const c = S.historie.filter((c2) => c2.zeit && c2.zeit < stempel(L[i - 1]) && c2.zeit >= stempel(z));
      if (c.length) hist = `<tr class="historie"><td colspan="${7 + typen.length}">Danach geändert: ${c.slice(0, 6).map((c2) => `<code>${esc(c2.hash)}</code>${esc(c2.text.slice(0, 90))}`).join(" · ")}${c.length > 6 ? " · … " + (c.length - 6) + " weitere" : ""}</td></tr>`; }
    return hist + `<tr class="zeile" data-d="${esc(x.datei)}" title="Klicken: dieses Spiel öffnen"><td><input type="checkbox" data-w="${esc(x.datei)}" ${gew ? "checked" : ""} title="zum Vergleich wählen"></td>

      <td class="zahl">${x.kill_takt ? zahl(x.kill_takt, 0) : "–"}</td><td class="zahl gesamt">${pkt(z.summe)}</td><td class="balken-z">${balken(z.summe, max)}</td>
      ${typen.map((t) => { const a = z.arten.find((y) => y.typ === t); return `<td class="zahl">${a ? pkt(a.je) + (z.beste && z.beste.typ === t ? ' <span class="stern" title="beste Art dieses Spiels (Punkte je Einheit)">★</span>' : "") : '<span class="null">·</span>'}</td>`; }).join("")}</tr>`;
  }).join("");
  v.innerHTML = `<div class="leiste"><div class="chips">
      <button class="chip" id="f-auf" aria-pressed="${S.spFilter.aufstellung}" title="nur Spiele mit derselben Aufstellung wie das oben gewählte">nur gleiche Aufstellung${jetzt ? ": " + esc(jetzt) : ""}</button>
      <button class="chip" id="f-log" aria-pressed="${S.spFilter.logbuch}">nur mit Logbuch</button></div>
      <span class="hinweis">${L.length} Spiele${st.laeuft ? " · rechne noch: " + st.fertig + " von " + st.gesamt : ""}${st.fehler.length ? " · " + st.fehler.length + " nicht lesbar" : ""} · ★ = beste Art je Spiel (Punkte je Einheit) · Häkchen setzen zum Vergleichen · zwischen den Spielen: was am Code geändert wurde</span></div>
    ${vergleich(L, typen, namen)}
    <div class="tafel"><table><thead><tr><th></th><th class="l" data-s="zeit">Spiel ${pf("zeit")}</th><th class="l">Wer gegen wen</th><th class="l">Ergebnis</th><th data-s="kill">Kill bei Takt ${pf("kill")}</th><th data-s="summe">Punkte ${pf("summe")}</th><th class="l"></th>
      ${typen.map((t) => `<th data-s="t${t}" title="${esc(namen.get(t))}: Punkte je Einheit">${bildEinheit(t, namen.get(t))} ${pf("t" + t)}</th>`).join("")}</tr></thead><tbody>${zeilen}</tbody></table></div>`;
  $("#f-auf", v).onclick = () => { S.spFilter.aufstellung = !S.spFilter.aufstellung; zeichneSpiele(); };
  $("#f-log", v).onclick = () => { S.spFilter.logbuch = !S.spFilter.logbuch; zeichneSpiele(); };
  v.querySelectorAll("th[data-s]").forEach((th) => (th.onclick = () => { const s = th.dataset.s; S.spSort = { k: s, ab: k.k === s ? !k.ab : s !== "kill" }; zeichneSpiele(); }));
  v.querySelectorAll("input[data-w]").forEach((c) => (c.onclick = (ev) => { ev.stopPropagation(); c.checked ? S.wahl.add(c.dataset.w) : S.wahl.delete(c.dataset.w); zeichneSpiele(); }));
  v.querySelectorAll("tr[data-d]").forEach((tr) => (tr.onclick = (ev) => { if (ev.target.tagName === "INPUT") return; ladePartie(tr.dataset.d).then(() => zeige("einheiten")); }));
  const z = $("#vgl-leeren", v); if (z) z.onclick = () => { S.wahl.clear(); zeichneSpiele(); };

function vergleich(L, typen, namen) {
  const G = L.filter((z) => S.wahl.has(z.x.datei)).sort((a, b) => a.x.datei.localeCompare(b.x.datei));
  if (G.length < 2) return '<p class="hinweis">Vergleich: mindestens zwei Spiele anhaken. Dann stehen je Art und je Regler die Punkte nebeneinander, das Beste je Zeile mit ★.</p>';
  const zeile = (titel, werte, bild) => { const da = werte.filter((x) => x != null), best = Math.max(...da);
    return `<tr><td class="l">${bild || ""}${esc(titel)}</td>${werte.map((x) => `<td class="zahl">${x == null ? '<span class="null">·</span>' : pkt(x) + (x === best && da.length > 1 ? ' <span class="stern">★</span>' : "")}</td>`).join("")}</tr>`; };
  const artZ = typen.map((t) => zeile(kurzArt(namen.get(t)) + " je Einheit", G.map((z) => { const a = z.arten.find((y) => y.typ === t); return a ? a.je : null; }), bildEinheit(t, namen.get(t)) + " "));
  const regZ = aktiv().map((r) => zeile(kurzName(r), G.map((z) => Object.entries(z.x.arten).reduce((s, [t, a]) => s + (gilt(r, t) ? (a.menge[r.messgroesse] || 0) * r.gewicht : 0), 0))));
  const killZ = `<tr><td class="l">Kill bei Takt (früher ist besser)</td>${G.map((z) => { const ks = G.map((y) => y.x.kill_takt).filter(Boolean), best = Math.min(...ks);
    return `<td class="zahl">${z.x.kill_takt ? zahl(z.x.kill_takt, 0) + (z.x.kill_takt === best && ks.length > 1 ? ' <span class="stern">★</span>' : "") : "–"}</td>`; }).join("")}</tr>`;
  return `<div class="abschnitt">Vergleich von ${G.length} Spielen <button class="knopf" id="vgl-leeren">Auswahl leeren</button></div>
    <div class="tafel" style="margin-bottom:14px"><table><thead><tr><th class="l">Zeile</th>${G.map((z) => `<th title="${esc(z.x.datei)}">${esc(z.x.zeit)}<br><span class="marke ${z.x.ergebnis}">${ERG[z.x.ergebnis]}</span></th>`).join("")}</tr></thead>
    <tbody>${killZ}${zeile("Punkte gesamt", G.map((z) => z.summe))}${artZ.join("")}${regZ.join("")}</tbody></table></div>`;
}

      <div class="innen"><div class="hinweis">dein Wort: „${esc(m.wort)}“ · Menge in ${esc(m.einheit)} · ${esc(r.gesetzt_von || "")}</div>
      <div class="reihe"><input type="range" min="-10" max="10" step="0.1" value="${r.gewicht}" data-f="gewicht" data-id="${esc(r.id)}"><input type="number" min="-10" max="10" step="0.1" value="${r.gewicht}" data-f="gewicht" data-id="${esc(r.id)}">${artWahl(r)}
      <button class="knopf" data-arch="${esc(r.id)}" title="Archivieren: zählt nicht mehr mit, kommt mit einem Klick zurück">Archivieren</button></div></div></details>`; };
  const A = S.regler.filter((r) => !r.archiviert), arch = S.regler.filter((r) => r.archiviert);
  v.innerHTML = `<div class="leiste"><button class="knopf" id="zurueck" title="Stand vor der letzten Änderung wiederherstellen (der Verlauf behält beides)">Letzte Änderung zurücknehmen</button>
      <span class="hinweis" id="regstatus">Gewicht von −10 bis +10. Änderungen werden sofort gespeichert und rechnen alle Partien neu.</span></div>
    <div class="gruppe"><h4>Lohn</h4>${A.filter((r) => r.gewicht >= 0).map(klappe).join("")}</div>
    <div class="gruppe"><h4>Abzug</h4>${A.filter((r) => r.gewicht < 0).map(klappe).join("")}</div>
    <div class="abschnitt">Neuer Regler</div>
    <div class="neu-regler"><select id="neu-mg">${Object.entries(S.mg).map(([k2, m]) => `<option value="${k2}">${esc(m.name)}</option>`).join("")}</select>
      <select id="neu-art"><option value="alle">alle Arten</option>${typen.map(([t, n]) => `<option value="${t}">nur ${esc(kurzArt(n))}</option>`).join("")}</select>
      <input type="number" id="neu-gewicht" min="-10" max="10" step="0.1" value="1" style="width:80px"><button class="knopf voll" id="neu">Regler anlegen</button>
      <span class="hinweis">Beispiel: „Steht ohne Wirkung“ nur für Speerträger mit Gewicht −3.</span></div>
    <div class="abschnitt">Archiv (${arch.length})</div>${arch.length ? arch.map((r) => `<details class="regler"><summary><span>${esc(kurzName(r))}</span><span class="zahl">${zahl(r.gewicht, 2)}</span><span></span><button class="knopf" data-holen="${esc(r.id)}">Zurückholen</button></summary></details>`).join("") : '<p class="hinweis">Leer.</p>'}`;
  v.querySelectorAll("[data-f]").forEach((el) => (el.oninput = () => { const r = S.regler.find((x) => x.id === el.dataset.id);
    if (el.dataset.f === "gewicht") { let w2 = parseFloat(el.value); if (isNaN(w2)) return; w2 = Math.max(-10, Math.min(10, w2)); r.gewicht = w2;
      v.querySelectorAll(`[data-f="gewicht"][data-id="${CSS.escape(r.id)}"]`).forEach((x) => { if (x !== el) x.value = w2; });
      const d = el.closest("details").querySelector("summary .zahl"); d.textContent = (w2 > 0 ? "+" : "") + zahl(w2, 2); d.className = "zahl " + (w2 >= 0 ? "pos" : "neg"); }
    else r.arten = el.value === "alle" ? "alle" : [parseInt(el.value, 10)];
    r.gesetzt_von = "von Hand gesetzt"; speichern("Regler " + S.mg[r.messgroesse].name + " geändert"); }));
  v.querySelectorAll("[data-arch]").forEach((b) => (b.onclick = () => { const r = S.regler.find((x) => x.id === b.dataset.arch); r.archiviert = true; speichern("archiviert: " + kurzName(r), true); }));
  v.querySelectorAll("[data-holen]").forEach((b) => (b.onclick = (ev) => { ev.preventDefault(); const r = S.regler.find((x) => x.id === b.dataset.holen); r.archiviert = false; speichern("zurückgeholt: " + kurzName(r), true); }));
  $("#neu", v).onclick = () => { const mg = $("#neu-mg").value, art = $("#neu-art").value, w2 = Math.max(-10, Math.min(10, parseFloat($("#neu-gewicht").value) || 0));
    let id = mg + "_" + art, i = 2; while (S.regler.some((x) => x.id === id)) id = mg + "_" + art + "_" + i++;
    S.regler.push({ id, messgroesse: mg, arten: art === "alle" ? "alle" : [parseInt(art, 10)], gewicht: w2, name: S.mg[mg].name, wort: S.mg[mg].wort, archiviert: false, gesetzt_von: "von Hand angelegt" });
    speichern("neu: " + S.mg[mg].name + (art === "alle" ? "" : " nur " + art), true); };
  $("#zurueck", v).onclick = async () => { try { regAnnehmen(await holen("/api/regler/zurueck", { method: "POST", body: "{}" })); alles(); $("#regstatus").textContent = "zurückgenommen"; } catch (ex) { fehler(ex.message); } };
}
function speichern(grund, gleich) {
  kopf(); $("#regstatus") && ($("#regstatus").textContent = "speichere …"); clearTimeout(uhr);
  const los = async () => { try { regAnnehmen(await holen("/api/regler", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ regler: S.regler, grund }) }));
      fehler(""); const st = $("#regstatus"); if (st) st.textContent = "gespeichert " + new Date().toLocaleTimeString("de-DE"); if (gleich) zeichneRegler(); kopf(); }
    catch (ex) { fehler("Nicht gespeichert: " + ex.message); } };
  gleich ? los() : (uhr = setTimeout(los, 600));
}
function zeichneVerlauf() {
  $("#v-verlauf").innerHTML = `<div class="leiste"><span class="hinweis">Jede Änderung an den Reglern, neueste zuerst. Zurücknehmen legt eine neue Änderung an, nichts verschwindet.</span></div>
    <div class="verlauf">${S.verlauf.length ? S.verlauf.map((x) => `<div class="eintrag"><div class="hinweis">${esc(x.zeit)} · ${esc(x.wer || "")}</div><b>${esc(x.grund || "Änderung")}</b><div class="hinweis">${x.aenderungen.map(esc).join(" · ") || "keine Werte geändert"}</div></div>`).join("") : '<div class="leer">Noch keine Änderung.</div>'}</div>`;
}
function zeichneAnsicht() {
  if (!S.partie && !["regler", "verlauf", "spiele"].includes(S.ansicht)) return;
  ({ einheiten: zeichneEinheiten, arten: zeichneArten, spiele: zeichneSpiele, regler: zeichneRegler, verlauf: zeichneVerlauf })[S.ansicht]();
}
function alles() { kopf(); zeichneAnsicht(); }
function zeige(a, ohneVerlauf) {
  S.ansicht = a; document.querySelectorAll(".reiter button").forEach((b) => b.setAttribute("aria-selected", b.dataset.ansicht === a));
  for (const n of ["einheiten", "arten", "spiele", "regler", "verlauf"]) $("#v-" + n).hidden = n !== a;
  if (!ohneVerlauf) adresse(false); zeichneAnsicht();
}
document.querySelectorAll(".reiter button").forEach((b) => (b.onclick = () => zeige(b.dataset.ansicht)));
start();
</script>
</body>
</html>
