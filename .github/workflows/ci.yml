name: Offline framework

on:
  push:
    branches: [main, feature/organization]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.9'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra audit
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run --extra audit selfaware run absender_pruefen
      - run: uv build
      - run: uv run selfaware doctor --offline
      - run: uv run selfaware replay tests/fixtures/legacy_sample.jsonl
      - name: Build the 32-bit Windows game DLL
        if: runner.os == 'Windows'
        run: |
          rustup target add i686-pc-windows-msvc
          cargo build --locked --release --target i686-pc-windows-msvc --manifest-path crates/samurai-kern/Cargo.toml
      - name: Run the core unit tests
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path crates/samurai-kern/Cargo.toml
      - name: Keep the game DLL
        if: runner.os == 'Windows' && matrix.python == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: samurai_kern-i686
          path: crates/samurai-kern/target/i686-pc-windows-msvc/release/samurai_kern.dll
          if-no-files-found: error
          retention-days: 30
