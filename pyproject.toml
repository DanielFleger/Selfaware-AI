[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "selfaware-ai"
version = "0.1.0"
description = "An offline-testable Stronghold Crusader bot framework and legacy research workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.2,<2"]
legacy = ["PyYAML>=6,<7", "Pillow>=10,<13", "numpy>=2,<3"]
audit = ["lupa>=2,<3"]

[project.scripts]
selfaware = "selfaware.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/selfaware"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "docs", "bridge", "tools", "werkzeug/*.py", "README.md", "AGENTS.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.uv]
required-version = "==0.12.9"
