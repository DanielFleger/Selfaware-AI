[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "selfaware-ai"
version = "0.1.0"
description = "An offline-testable Stronghold Crusader bot framework and legacy research workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build>=1.2,<2"]
legacy = ["PyYAML>=6,<7", "Pillow>=10,<13", "numpy>=2,<3"]
audit = ["lupa>=2,<3", "capstone>=5,<6"]

[project.scripts]
selfaware = "selfaware.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/selfaware"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "audit", "configs", "docs", "bridge", "tools", "research", "assets", "README.md", "AGENTS.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
# Relocated historical sources retain their formatting; new modules are checked.
extend-exclude = [
    "src/selfaware/tools/checks/absender_pruefen.py",
